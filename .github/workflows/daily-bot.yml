name: Immaculate Daily SEO Bot

on:
  schedule:
    # Her gün 04:17 UTC (Türkiye 07:17)
    - cron: '17 4 * * *'
  workflow_dispatch:  # Manuel de çalıştırabilesin

permissions:
  contents: write

concurrency:
  group: daily-seo-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ultra Premium Bot
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: python bot.py

      - name: Commit & Push Report
        run: |
          git config user.name "Immaculate SEO Bot"
          git config user.email "bot@immaculate.tr"
          git add docs/
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "chore: daily SEO report $(date -u +%Y-%m-%d)"
            git push
          )
